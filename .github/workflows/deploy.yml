# GitHub Pages への公開と、毎朝の天気の更新。
#
# - main への push: そのまま公開する
# - 毎日 5:00 (JST) と手動実行: 天気を取得して data/weather.json をコミット・push してから公開する
#
# リポジトリの Settings → Pages → Source を「GitHub Actions」にしておくこと。

name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * *" # 20:00 UTC = 5:00 JST。混雑時は数十分遅れることがある
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event_name != 'push'
        with:
          node-version: 22

      # GITHUB_TOKEN での push では次のワークフローは起動しないので、公開はこのジョブの中で行う
      - name: 天気を更新してコミット
        if: github.event_name != 'push'
        run: |
          node scripts/fetch-weather.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/weather.json
          if git diff --cached --quiet; then
            echo "天気に変更なし"
          else
            git commit -m "Update weather for $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
