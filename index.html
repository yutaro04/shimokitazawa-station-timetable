<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>下北沢駅 発車案内</title>
    <link rel="stylesheet" href="css/board.css" />
  </head>
  <body>
    <header class="station">
      <div class="station-name">
        <span class="station-ja">下北沢</span>
        <span class="station-en">Shimo-Kitazawa</span>
      </div>
      <div class="status">
        <div id="weather" class="weather" hidden></div>
        <span id="day-type" class="day-type"></span>
        <time id="clock" class="clock"></time>
      </div>
    </header>

    <main id="boards" class="boards"></main>

    <footer id="ticker" class="ticker" hidden>
      <span id="ticker-text" class="ticker-text"></span>
    </footer>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
